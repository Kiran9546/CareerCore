# Render Blueprint for the CareerCore API and ML service.
#
# NOT YET DEPLOYED OR VALIDATED ON RENDER. Written against Render's
# Blueprint reference (https://render.com/docs/blueprint-spec); check the
# preview Render shows before creating anything. See DEPLOYMENT.md, section 5.
#
# The website itself is deployed on Vercel from client/ (client/vercel.json),
# not from this file.
#
# Secrets are never written here: values marked `sync: false` are asked for
# once, in the Render dashboard, when the Blueprint is first created.
#
# PLAN: both services are set to the free plan so that nothing is billed
# without a decision (Render's default when `plan` is omitted is a paid
# instance). Free web services spin down after 15 minutes without traffic
# (about a minute to wake), cannot have a persistent disk (uploaded resume
# photos are lost on every restart or deploy), and scheduled jobs such as
# registration-deadline closing do not run while asleep. For real use, change
# `plan` to a paid instance type and enable the disk below.
#
# REGION: omitted, so Render's default applies. Set `region` (for example
# singapore) to match where your MongoDB cluster runs.

services:
  - type: web
    name: careercore-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node index.js
    # 503 until the database is connected, so a deploy only goes live once
    # the API can serve requests.
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      # Tested locally on Node 24.
      - key: NODE_VERSION
        value: "24"
      - key: WEB_CONCURRENCY
        value: "1"
      # Production database connection string (MongoDB Atlas or similar).
      - key: MONGO_URI
        sync: false
      # A random 256-bit value generated by Render on first creation.
      - key: JWT_SECRET
        generateValue: true
      # The website's https address(es), comma-separated: the Vercel
      # production address now, plus the custom domain once it exists.
      - key: CLIENT_URL
        sync: false
      # The ML service's https address (its Render URL, shown after it is
      # created). The API still works if this is unreachable.
      - key: ML_SERVICE_URL
        sync: false
      # Placement drive notifications (see DEPLOYMENT.md, section 10).
      # Email needs the SMTP_* values; WhatsApp stays off until its template
      # is approved and the WHATSAPP_* secrets are entered in the dashboard.
      - key: NOTIFICATION_DELIVERY_MODE
        value: live
      - key: PUBLIC_APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: NOTIFY_WHATSAPP_ENABLED
        value: "false"
    # Persistent storage for uploaded resume photos (paid plans only).
    # Uncomment together with a paid `plan`, and add UPLOAD_DIR=/var/data/uploads
    # to envVars.
    # disk:
    #   name: uploads
    #   mountPath: /var/data
    #   sizeGB: 1

  - type: web
    name: careercore-ml
    runtime: python
    rootDir: ml-service
    plan: free
    # Installs dependencies, generates the training data and trains the model.
    buildCommand: bash build.sh
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 60 app:app
    healthCheckPath: /health
    envVars:
      # Same version as ml-service/runtime.txt; Render needs it fully qualified.
      - key: PYTHON_VERSION
        value: 3.12.7
