# ═══════════════════════════════════════════════════════════════════
# CareerCore — production-style stack
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml up -d --scale server=3
#
#   client  :80   nginx serving the built app and proxying /api to the API
#   server        Express API — stateless, scale it horizontally
#   ml-service    Flask model service
#   mongo         MongoDB (replace with Atlas by setting MONGO_URI)
#
# Required in a .env file next to this one (or the shell environment):
#   JWT_SECRET=<long random string>
# Optional:
#   MONGO_URI, CLIENT_URL, WEB_CONCURRENCY, MONGO_POOL_SIZE, SMTP_*, CONTACT_INBOX
#   SITE_URL   (https://your-domain) and SITE_HOST (your-domain) for SEO and redirects
#   CLIENT_BIND, TRUST_PROXY when a TLS proxy runs in front (see DEPLOYMENT.md)
# ═══════════════════════════════════════════════════════════════════

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build: ./ml-service
    restart: unless-stopped

  server:
    build: ./server
    restart: unless-stopped
    # No container_name and no published port, so `--scale server=N` works;
    # nginx in the client container spreads requests across the replicas.
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/careercore}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ML_SERVICE_URL: http://ml-service:5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      # Proxy hops in front of the API: 1 when the client's nginx is the only
      # proxy, 2 when a TLS proxy (such as Caddy) sits in front of it.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-auto}
      MONGO_POOL_SIZE: ${MONGO_POOL_SIZE:-20}
      UPLOAD_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      CONTACT_INBOX: ${CONTACT_INBOX:-}
      NOTIFICATION_DELIVERY_MODE: ${NOTIFICATION_DELIVERY_MODE:-live}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CareerCore Placement Cell}
      NOTIFY_WHATSAPP_ENABLED: ${NOTIFY_WHATSAPP_ENABLED:-false}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-placement_drive_alert}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
    volumes:
      - uploads:/data/uploads     # shared by every replica
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        # Public https address, e.g. https://careercore.example.edu. Used for
        # canonical links, sharing metadata, structured data and sitemap.xml.
        VITE_SITE_URL: ${SITE_URL:-}
    restart: unless-stopped
    ports:
      # Host port for the site. The default serves plain http on port 80. Set
      # CLIENT_BIND=127.0.0.1:8080 when a TLS proxy on the same machine owns
      # ports 80 and 443 (see DEPLOYMENT.md).
      - "${CLIENT_BIND:-80}:80"
    environment:
      API_UPSTREAM: http://server:4000
      # Preferred host name (no scheme), e.g. careercore.example.edu. When set,
      # other host names and plain-http requests get a 301 to https://SITE_HOST.
      SITE_HOST: ${SITE_HOST:-}
    depends_on:
      - server

volumes:
  mongo-data:
  uploads:
